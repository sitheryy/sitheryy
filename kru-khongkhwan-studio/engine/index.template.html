<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Mali';src:url(fonts/Mali-Bold.ttf);font-weight:700}
@font-face{font-family:'Mali';src:url(fonts/Mali-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#222}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timing.js"></script><script src="lib.js"></script><script src="base.js"></script><script src="story.js"></script>
<script>
const CV=document.getElementById('c'),CTX=CV.getContext('2d'),IMG={},EXT={__EXT__};
async function boot(){
  await Promise.all(['700 40px Mali','600 40px Mali'].map(f=>document.fonts.load(f,'กขค')));
  await Promise.all(Object.keys(EXT).map(n=>new Promise(ok=>{const im=new Image();im.onload=()=>{IMG[n]=im;ok()};im.onerror=()=>{console.error('img',n);ok()};im.src='img/'+n+'.'+EXT[n];})));
  init(); window.READY=true;
}
window.grab=(t,q)=>{drawFrame(CTX,t);return CV.toDataURL('image/jpeg',q||.9)};
boot();
</script></body></html>
